<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-label="Engraved orange">
  <defs>
    <radialGradient id="skin" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#ffd7a3"/>
      <stop offset="30%" stop-color="#fb923c"/>
      <stop offset="70%" stop-color="#e85d08"/>
      <stop offset="100%" stop-color="#932a04"/>
    </radialGradient>
    <radialGradient id="shade" cx="30%" cy="24%" r="82%">
      <stop offset="52%" stop-color="#3d1102" stop-opacity="0"/>
      <stop offset="82%" stop-color="#3d1102" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3d1102" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="leaf" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#5aa06d"/>
      <stop offset="55%" stop-color="#2f6b45"/>
      <stop offset="100%" stop-color="#12331e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#fb923c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f0ea"/>
    </linearGradient>
    <filter id="soft18" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft30" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="ball"><circle cx="360" cy="392" r="212"/></clipPath>
  </defs>

  <style>
    .paper  { fill: url(#paper); }
    .plate  { fill: none; stroke: #171717; stroke-opacity: .07; }
    .ground { fill: #1c1206; opacity: .17; }
    .meridian { fill: none; stroke: #ffffff; stroke-opacity: .24; stroke-width: 1.6; }
    .parallel { fill: none; stroke: #4a1403; stroke-opacity: .17; stroke-width: 1.3; }
    @media (prefers-color-scheme: dark) {
      .paper  { fill: #15151a; }
      .plate  { stroke: #ffffff; stroke-opacity: .08; }
      .ground { opacity: .55; }
      .meridian { stroke-opacity: .15; }
      .parallel { stroke-opacity: .34; }
    }
  </style>

  <circle cx="360" cy="374" r="336" fill="url(#halo)"/>
  <circle class="paper" cx="360" cy="360" r="288"/>
  <circle class="plate" cx="360" cy="360" r="288" stroke-width="1.5"/>
  <ellipse class="ground" cx="360" cy="616" rx="170" ry="28" filter="url(#soft30)"/>

  <circle cx="360" cy="392" r="212" fill="url(#skin)"/>

  <g clip-path="url(#ball)">
    <g class="meridian">
      <ellipse cx="360" cy="392" rx="46" ry="212"/>
      <ellipse cx="360" cy="392" rx="96" ry="212"/>
      <ellipse cx="360" cy="392" rx="146" ry="212"/>
      <ellipse cx="360" cy="392" rx="186" ry="212"/>
    </g>
    <g class="parallel">
      <ellipse cx="360" cy="392" rx="212" ry="48"/>
      <ellipse cx="360" cy="300" rx="191" ry="38"/>
      <ellipse cx="360" cy="484" rx="191" ry="38"/>
      <ellipse cx="360" cy="216" rx="118" ry="26"/>
      <ellipse cx="360" cy="568" rx="118" ry="26"/>
    </g>
    <circle cx="360" cy="392" r="212" fill="url(#shade)"/>
  </g>

  <ellipse cx="288" cy="302" rx="76" ry="46" fill="#ffffff" opacity=".3" filter="url(#soft18)" transform="rotate(-30 288 302)"/>
  <circle cx="360" cy="596" r="14" fill="#7a2403" opacity=".32"/>

  <path d="M359 188 C 350 162, 354 142, 365 127" fill="none" stroke="#3f2a12" stroke-width="9" stroke-linecap="round"/>
  <path d="M365 152 C 396 106, 452 99, 487 117 C 470 166, 417 187, 365 152 Z" fill="url(#leaf)"/>
  <path d="M365 152 C 404 147, 449 133, 487 117" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.4"/>
  <path d="M355 161 C 320 130, 275 128, 249 143 C 267 177, 314 187, 355 161 Z" fill="url(#leaf)" opacity=".92"/>
  <path d="M355 161 C 322 157, 284 149, 249 143" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.2"/>
</svg>
